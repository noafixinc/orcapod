name: Feature request
description: Propose a change or an addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it work? Alternatives you considered are welcome.
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
