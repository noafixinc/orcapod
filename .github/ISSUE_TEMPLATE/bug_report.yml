name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or code that reproduce the problem from a clean install.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you ran (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: macOS version, `node --version`, Orca version (`make doctor` prints it), the AI CLI and its version.
